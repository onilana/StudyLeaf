# Project-wide Gradle settings.
# Specifies the JVM arguments optimized for 4GB RAM hardware to prevent disk swapping.
org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# Restrict workers to 2 on 4-core / 4GB RAM to prevent memory thrashing
org.gradle.workers.max=2

kotlin.code.style=official
android.nonTransitiveRClass=true
googleServices.missing.passthrough=true
